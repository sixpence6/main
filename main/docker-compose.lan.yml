# Controlled HTTPS/LAN overlay. Apply it explicitly:
#   PUBLIC_HOSTNAME=192.168.1.10 PUBLIC_ORIGIN=https://192.168.1.10:8443 \
#     PUBLIC_BIND_ADDRESS=192.168.1.10 docker compose -f docker-compose.yml \
#     -f docker-compose.lan.yml up -d --build
#
# The backend stays on 127.0.0.1:8000 in the base file and is never published
# on the LAN interface. Only the nginx HTTPS listener is bound to
# PUBLIC_BIND_ADDRESS. TLS_CERT_DIR must contain server.crt and server.key.
name: ecommerce-image-workspace

services:
  backend:
    environment:
      APP_PUBLIC_URL: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required, for example https://192.168.1.10:8443}"
      ALLOWED_ORIGINS: '["${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"]'
      ALLOWED_HOSTS: '["${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}"]'
      ALLOW_LOOPBACK_HTTP: "false"
      AUTH_COOKIE_SECURE: "true"
      TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'

  frontend:
    build:
      args:
        NGINX_TEMPLATE: docker/nginx-tls.conf.template
    ports:
      - "${PUBLIC_BIND_ADDRESS:?PUBLIC_BIND_ADDRESS is required}:${PUBLIC_HTTPS_PORT:-8443}:443"
    environment:
      PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}"
      PUBLIC_HTTPS_PORT: "${PUBLIC_HTTPS_PORT:-8443}"
      TLS_CERT_PATH: /etc/nginx/tls/server.crt
      TLS_KEY_PATH: /etc/nginx/tls/server.key
    volumes:
      - "${TLS_CERT_DIR:-./certs}:/etc/nginx/tls:ro"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
