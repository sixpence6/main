[project]
name = "ecommerce-image-backend"
version = "0.1.0"
description = "Local-only backend for the ecommerce image workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pillow>=11.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../main/backend"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["../main/backend", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
