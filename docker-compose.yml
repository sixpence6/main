name: ecommerce-image-workspace

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ecommerce-image-workspace:local
    container_name: ecommerce-image-workspace
    ports:
      - "127.0.0.1:8090:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
